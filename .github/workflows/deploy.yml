name: Deploy to GitHub Pages

on:
  push:
    branches: [development]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bing discovers a static site on its own schedule, and ChatGPT's search citations lean on
  # Bing's index. IndexNow announces the new URLs the moment they are live. Runs after deploy so
  # the key file is already served when the engine verifies it; never fails the pipeline.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Announce the deployed URLs to IndexNow
        run: |
          curl -sS --fail -o public/sitemap.xml https://mi-code.pl/sitemap.xml
          node scripts/indexnow.mjs public
