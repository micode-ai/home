    <!-- Apply saved dark mode preference before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('a11y-settings');
          if (raw) {
            var s = JSON.parse(raw);
            if (s.darkMode) {
              document.documentElement.classList.add('dark-mode-active');
            }
          }
        } catch (e) {}
      })();
    </script>
