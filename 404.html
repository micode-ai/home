<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mi_code_logo_mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google Fonts: Poppins + Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Apply saved dark mode preference before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('a11y-settings');
          if (raw) {
            var s = JSON.parse(raw);
            if (s.darkMode) {
              document.documentElement.classList.add('dark-mode-active');
            }
          }
        } catch (e) {}
      })();
    </script>

    <title>404 — strona nie znaleziona | MiCode</title>
    <meta name="description" content="Ta strona nie istnieje lub została przeniesiona. Wróć na stronę główną MiCode." />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main-404.ts"></script>
  </body>
</html>
